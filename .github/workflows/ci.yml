name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest target/filter passed to nox as posargs"
        required: false
        default: ""

permissions: "read-all"

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: "Setup Python"
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: "3.x"
          cache: "pip"

      - name: "Check packages"
        run: |
          python -m pip install -U pip setuptools wheel build twine rstcheck
          python -m build
          rstcheck CHANGES.rst
          python -m twine check dist/*

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        os:
          - macos-latest
          - windows-latest
          - ubuntu-22.04
        nox-session: ['']
        include:
          - experimental: false
          # integration
          # 3.8 and 3.9 have a known issue with large SSL requests that we work around:
          # https://github.com/urllib3/urllib3/pull/3181#issuecomment-1794830698
          - python-version: "3.8"
            os: ubuntu-latest
            experimental: false
            nox-session: test_integration
          - python-version: "3.9"
            os: ubuntu-latest
            experimental: false
            nox-session: test_integration
          - python-version: "3.12"
            os: ubuntu-latest
            experimental: false
            nox-session: test_integration
          # OpenSSL 1.1.1
          - python-version: "3.8"
            os: ubuntu-22.04
            experimental: false
            nox-session: test-3.8
          # pypy
          - python-version: "pypy-3.8"
            os: ubuntu-latest
            experimental: false
            nox-session: test-pypy3.8
          - python-version: "pypy-3.9-v7.3.13"
            os: ubuntu-latest
            experimental: false
            nox-session: test-pypy3.9
          - python-version: "pypy-3.10"
            os: ubuntu-latest
            experimental: false
            nox-session: test-pypy3.10
          - python-version: "3.12"
          # brotli
            os: ubuntu-22.04
            experimental: false
            nox-session: test_brotlipy
          # Test CPython with a broken hostname_checks_common_name (the fix is in 3.9.3)
          - python-version: "3.9"
            os: ubuntu-22.04
            experimental: false
            nox-session: test-3.9
          - python-version: "3.11"
            os: ubuntu-latest
            nox-session: emscripten
            experimental: true
          - python-version: "3.13"
            experimental: true
        exclude:
          # Ubuntu 22.04 comes with OpenSSL 3.0, so only CPython 3.9+ is compatible with it
          # https://github.com/python/cpython/issues/83001
          - python-version: "3.8"
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}
    name: ${{ fromJson('{"macos-latest":"macOS","windows-latest":"Windows","ubuntu-latest":"Ubuntu","ubuntu-22.04":"Ubuntu 22.04 (OpenSSL 3.0)"}')[matrix.os] }} ${{ matrix.python-version }} ${{ matrix.nox-session}}
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: "Setup Python ${{ matrix.python-version }} (macOS arm64, old CPython)"
        if: ${{ startsWith(matrix.os, 'macos') && (matrix.python-version == '3.8' || matrix.python-version == '3.9') }}
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          allow-build: allow
          cache-build: true

      - name: "Setup Python ${{ matrix.python-version }}"
        if: ${{ !(startsWith(matrix.os, 'macos') && (matrix.python-version == '3.8' || matrix.python-version == '3.9')) }}
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: "Pin nox tooling"
        # argcomplete>=3.6 (pulled by current nox) fails to import on Python 3.8/3.9
        run: printf 'nox<2025\nargcomplete<3.6\n' > ci-constraints.txt

      - name: "Install dependencies"
        run: python -m pip install --upgrade pip setuptools nox
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/ci-constraints.txt

      - name: "Install Chrome"
        uses: browser-actions/setup-chrome@b94431e051d1c52dcbe9a7092a4f10f827795416 # v2.1.0
        if: ${{ matrix.nox-session == 'emscripten' }}
        id: setup-chrome
        with:
          install-chromedriver: true
          chrome-version: canary
      - name: Force override system chrome
        run: |
          sudo rm -f /usr/bin/google-chrome
          sudo rm -f /usr/bin/chrome
          sudo ln -s ${{ steps.setup-chrome.outputs.chrome-path }} /usr/bin/google-chrome
          sudo ln -s ${{ steps.setup-chrome.outputs.chrome-path }} /usr/bin/chrome
          google-chrome --version
        if: ${{ matrix.nox-session == 'emscripten' }}

      - name: "Install Firefox"
        uses: browser-actions/setup-firefox@5914774dda97099441f02628f8d46411fcfbd208 # v1.7.0
        if: ${{ matrix.nox-session == 'emscripten' }}
      - name: "Run tests"
        # If no explicit NOX_SESSION is set, run the default tests for the chosen Python version
        run: nox -s ${NOX_SESSION:-test-$PYTHON_VERSION} ${TEST_FILTER:+-- $TEST_FILTER}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          NOX_SESSION: ${{ matrix.nox-session }}
          TEST_FILTER: ${{ inputs.test-filter }}

      - name: "Upload coverage data"
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: coverage-data-${{ matrix.python-version }}-${{ matrix.os }}-${{ matrix.experimental }}-${{ matrix.nox-session }}
          path: ".coverage.*"
          if-no-files-found: error
